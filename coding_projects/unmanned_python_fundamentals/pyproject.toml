[project]
name = "robotics-python-workshop"
version = "0.1.0"
description = "Two hands-on Python fundamentals lectures for robotics students"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0,<3", "matplotlib>=3.9,<4", "ipykernel>=6.29,<8", "jupyterlab>=4.3,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "nbclient>=0.10,<1", "nbformat>=5.10,<6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
